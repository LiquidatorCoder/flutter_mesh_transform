name: flutter_mesh_transform
description: A drop-in mesh distortion / warp effect for any Flutter widget, driven by a spring simulation and a fragment shader.
version: 0.1.0

environment:
  sdk: ^3.11.1
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_shaders: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/distortion.frag
